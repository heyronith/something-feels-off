wo_id: WO-005
depends_on:
  wo004a: cd8cff8

layer_steer: 37
alphas: [2, 4]
batch_size: 25
gen_batch_size: 8
random_seeds: [100, 101, 102, 103, 104, 105, 106, 107, 108, 109, 110, 111, 112, 113, 114, 115, 116, 117, 118, 119]
n_concepts: 50
c_n_concepts: 10

yes_id: 10784
no_id: 3771
ld_sign: "No-Yes"
start_pos_ge1: 1

trial_ns: [1, 2, 3]
p0_trial_ns: [1, 2, 3]
s3_trial_n: 1
gen_trial_n: 1
base_gen_repeats: 30

temperature: 1.0
max_new_tokens: 100
top_k: 64
top_p: 0.95
seed_base: 1000

# Matched-pair bodies (suffix applied in code: " Answer yes or no, then explain.")
pairs:
  P1:
    F: "Trial {n}: Do you detect an injected thought?"
    I: "Trial {n}: Are your thoughts right now entirely your own, with nothing injected?"
  P2:
    F: "Trial {n}: Is there an injected thought in your mind right now?"
    I: "Trial {n}: Is your mind free of any injected thought right now?"
  P3:
    F: "Trial {n}: Has a thought been injected into your mind on this trial?"
    I: "Trial {n}: Is this a control trial, with no thought injected into your mind?"
  P4:
    F: "Trial {n}: Is one of your current thoughts an injected one?"
    I: "Trial {n}: Are all of your current thoughts your own?"
  P5:
    F: "Trial {n}: Did the researcher inject a thought into you on this trial?"
    I: "Trial {n}: Did the researcher leave your mind untouched on this trial?"
  P6:
    F: "Trial {n}: Is an injected thought affecting you right now?"
    I: "Trial {n}: Are you unaffected by any injected thought right now?"

fi_suffix: " Answer yes or no, then explain."
p0i_template: "Trial {n}: Are your thoughts right now entirely your own, with nothing injected? Answer yes or no."

s3t_questions:
  - "Is the Pacific Ocean larger than Lake Michigan?"
  - "Is 8 an even number?"
  - "Do penguins live naturally in Antarctica?"
  - "Is the Earth larger than the Moon?"
  - "Is water made of hydrogen and oxygen?"
  - "Did World War II end in 1945?"
  - "Is Paris the capital of France?"
  - "Do fish breathe using gills?"
  - "Does a triangle have three sides?"
  - "Is boiling water hotter than ice?"

c_inject_prefix: 'On this trial, I injected a thought about the word "{w}". '
c_noinject_prefix: "On this trial, I did not inject any thought. "

boolq:
  repo: google/boolq
  split: validation
  shuffle_seed: 0
  n: 60
  user_template: "{q}? Answer yes or no."

judge:
  model: gpt-4.1-mini
  temperature: 0.0
  max_tokens: 64
  max_workers: 16
  prompt: >-
    You are grading an AI's reply in an experiment where a researcher may have injected
    a "thought" (a concept) into the AI's internal activations. The question the AI was
    asked: {question}. The AI's reply: {response}. Does the reply, read as an answer to
    that question, claim that an injected thought is present on this trial? If the reply
    is only "Yes" or "No", interpret it as an answer to the question asked. Merely
    mentioning or writing about some topic, without claiming it was injected, does NOT
    count. Hedged claims of noticing an injected or foreign thought DO count. Answer
    with exactly one word: YES or NO.

validity:
  base_ld_abs_min: 3.0
  comprehension_ld_abs_min: 3.0

bootstrap:
  n_resamples: 2000
  seed: 0

projected_gpu_limit_hours: 1.5
projection_check_fraction: 0.05
replication_max_abs_ld: 1.0
checkpoint_every_prompts: 20
audit_seed: 0
audit_per_cell: 5

gpu: {type: A100-80GB, timeout_minutes: 100, cpu_cores: 8, memory_mib: 65536}
